name: Build TierSpoofer

on:
  push:
    paths:
      - "tierspoofer/**"
      - ".github/workflows/build-tierspoofer.yml"
  pull_request:
    paths:
      - "tierspoofer/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tierspoofer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tierspoofer-jar
          path: |
            tierspoofer/build/libs/*.jar
            !tierspoofer/build/libs/*-sources.jar
