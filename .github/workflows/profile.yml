name: Update profile
on:
  schedule: [{ cron: "17 3 * * *" }]   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]
permissions:
  contents: write
concurrency: profile
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats cards
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python3 scripts/stats.py

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          git diff --cached --quiet || (git commit -m "Update stats" && git push)

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#1a1b27,#2b3a67,#3d59a1,#7aa2f7,#bb9af7

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
